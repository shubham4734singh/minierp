services:
  # The PostgreSQL Database
  - type: pgo
    name: minierp-db
    plan: free

  # The Node.js Web Service
  - type: web
    name: minierp-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: minierp-db
          property: connectionString
      - key: NODE_ENV
        value: production
